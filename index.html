<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketmaster Queue Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ticketmaster Queue Monitor</h1>
        
        <div class="tabs">
            <button id="browserTab" class="tab-button active">Browser Automation</button>
            <button id="generateTab" class="tab-button">Generate Queue Links</button>
        </div>

        <!-- Browser Automation Tab -->
        <div id="browserContent" class="tab-content active">
            <div class="input-section">
                <div class="proxy-section">
                    <label>
                        <input type="checkbox" id="useProxy"> Use Proxy
                    </label>
                    <label for="proxyList">Proxy List (one per line):</label>
                    <textarea id="proxyList" rows="5" placeholder="host:port:username:password&#10;thailand.proxy.com:8000:user:pass&#10;singapore.proxy.com:8000:user:pass&#10;malaysia.proxy.com:8000:user:pass&#10;indonesia.proxy.com:8000:user:pass" disabled></textarea>
                </div>

                <div class="links-section">
                    <label for="linksBox">Links (one per line):</label>
                    <textarea id="linksBox" rows="8" placeholder="Enter Ticketmaster links here, one per line..."></textarea>
                    <button id="loadLinksBtn">Load from File</button>
                </div>

                <div class="config-section">
                    <div class="config-row">
                        <label for="concurrencyInput">Concurrency:</label>
                        <input type="number" id="concurrencyInput" value="50" min="1" max="100">
                        
                        <label for="tabsPerBrowserInput">Tabs per Browser:</label>
                        <input type="number" id="tabsPerBrowserInput" value="25" min="1" max="50">
                        
                        <label for="maxBrowsersInput">Max Browsers:</label>
                        <input type="number" id="maxBrowsersInput" value="2" min="1" max="10">
                    </div>
                </div>

                <div class="button-section">
                    <button id="startBtn">Start Monitoring</button>
                    <button id="retryBtn" disabled>Retry Failed</button>
                </div>
            </div>

            <div class="results-section">
                <h3>Monitoring Results</h3>
                <table id="statusTable">
                    <thead>
                        <tr>
                            <th>Task</th>
                            <th>Link</th>
                            <th>IP</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- Generate Queue Links Tab -->
        <div id="generateContent" class="tab-content">
            <div class="input-section">
                <div class="proxy-section">
                    <label>
                        <input type="checkbox" id="useGenerateProxy"> Use Proxy
                    </label>
                    <label for="generateProxyList">Proxy List (one per line):</label>
                    <textarea id="generateProxyList" rows="5" placeholder="host:port:username:password&#10;thailand.proxy.com:8000:user:pass&#10;singapore.proxy.com:8000:user:pass&#10;malaysia.proxy.com:8000:user:pass&#10;indonesia.proxy.com:8000:user:pass" disabled></textarea>
                </div>

                <div class="event-url-section">
                    <label for="eventUrlInput">Paste Event URL:</label>
                    <input type="text" id="eventUrlInput" placeholder="https://www.ticketmaster.com/event/123456">
                </div>

                <div class="config-section">
                    <div class="config-row">
                        <label for="numBrowsersInput">No. of browsers:</label>
                        <input type="number" id="numBrowsersInput" value="30" min="1" max="100">
                    </div>
                </div>

                <div class="button-section">
                    <button id="generateBtn">Generate Queue Links</button>
                    <button id="copyAllBtn" disabled style="display: none;">Copy All Queue Links</button>
                </div>
            </div>

            <div class="results-section">
                <h3>Generation Results</h3>
                <table id="generateTable">
                    <thead>
                        <tr>
                            <th>Task ID</th>
                            <th>IP</th>
                            <th>Status</th>
                            <th>Queue Link</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
